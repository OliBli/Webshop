<h6>Travel Advice</h6>
<section class="TA">

        <a href="{{page.url}}"><img src="/img/{{page.image}}"> </a>
        <a href="{{page.url}}"><p class="ADT">{{page.title}}</p></a>
        <p class="ADP"> {{page.excerpt}}</p>

    <h5>CHECK ALL TRAVEL ADVICE</h5>
</section>
