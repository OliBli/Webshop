<h6>Explore By Style</h6>
<section class="ExStyle">
    {% for page in site.explore %}
       <div class="Explore">     
            <img class="ExImg" src="/img/{{page.image}}" >
            <a href="{{page.url}}"><p class="ExP">{{page.title}}</p></a>
        </div>
    {% endfor %}
    
</section>
